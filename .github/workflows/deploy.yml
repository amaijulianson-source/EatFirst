name: Deploy EatFirst to GitHub Pages
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:security
      # Hosted Ubuntu already supplies Chrome's shared libraries. Avoid a full
      # apt repository refresh for every run; still install the pinned browser.
      - name: Install Chromium
        run: npx playwright install chromium
        timeout-minutes: 5
      - run: npm run test:family-local
      - run: npm run test:e2e
      - name: Install WebKit for voice UI compatibility
        run: npx playwright install --with-deps webkit
        timeout-minutes: 5
      - name: Test voice UI and interruption recovery in WebKit
        run: EATFIRST_TEST_WEBKIT=true npx playwright test tests/e2e/voice.spec.ts --project=safari
      - run: npm run check:cloud-config && npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Keep existing preview links and OAuth callbacks working
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_RELEASE_PREVIEW: "true"
          BASE_PATH: /${{ github.event.repository.name }}/v2-preview/
        run: |
          npm run build -- --outDir dist-preview
          mkdir -p dist/v2-preview
          cp -a dist-preview/. dist/v2-preview/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
