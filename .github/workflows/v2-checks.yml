name: Feature checks without deployment
on:
  push:
    branches:
      [feat/family-sharing-v2, feat/recipe-engine-v3, feat/smart-entry-v4]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:security
      - run: npx playwright install --with-deps chromium
      - run: npm run test:family-local
      - run: npm run test:e2e
      - run: npm run check:cloud-config && npm run build
        env:
          BASE_PATH: /EatFirst/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
